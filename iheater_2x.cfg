#
# СПИСОК ИЗМЕНЕНИЙ (vostok_configuration):
# 1. TURN_OFF_HEATERS теперь выключает и нагрев камеры (iHEATER_OFF). Раньше цикл управления
#    каждую секунду снова включал нагреватели после PRINT_END, CANCEL_PRINT и ошибок печати;
# 2. iHEATER_ON: исправлено ожидание камеры. По умолчанию ждём chamber_target - start_offset,
#    раньше макрос ждал около 10°C и сразу продолжал. CHAMBER_AWAIT_TEMP - абсолютная температура.
#    Значения по умолчанию берутся из CHAMBER_VARS. Ограничение температуры стола 110°C убрано
#    (максимум задаёт [heater_bed] max_temp);
# 3. Отказ правого нагревателя больше не сообщается как "Left iHeater";
# 4. Исправлена передача имён неисправных нагревателей в _AC_POWER_FAULT;
# 5. Температура камеры - обычное среднее двух датчиков (было 2:1 в пользу одного);
# 6. Имена под VOSTOK: левый iHeater - основной (первый), правый - второй. Датчики камеры
#    iHeater_left_S / iHeater_right_S, кнопки iHeater_left_button / iHeater_right_button.
#    Комментарии переведены на русский.
# ===================================================================
#
# Два iHeater, каждый со своим MCU (STM32F042, подключение только по USB) и своим питанием 220В.
# Подключайте ВМЕСТО chamber_heater.cfg, не вместе с ним: оба файла определяют M141, M191 и
# TURN_OFF_HEATERS.
#
# Датчики (NTC 100K 3950), всего 4:
#   iHeater_left:TH0  - датчик нагревателя левого iHeater (обязателен)
#   iHeater_left:TH1  - датчик камеры
#   iHeater_right:TH0 - датчик нагревателя правого iHeater (обязателен)
#   iHeater_right:TH1 - датчик камеры
# Датчики камеры ставьте на уровне печатающих голов, над столом, вне потока горячего воздуха
# от нагревателей. Оголённые выводы датчиков нагревателей не должны касаться корпуса нагревателя.
#
# Перед первой печатью:
#   PID_CALIBRATE HEATER=iHeater_left_H TARGET=70
#   PID_CALIBRATE HEATER=iHeater_right_H TARGET=70
# Безопасную максимальную температуру нагревателей (max_heater_temp в CHAMBER_VARS) проверяйте
# ступенчато по 5-10°C: детали рядом с нагревателями не должны размягчаться.
# После проверок замените самовосстанавливающийся KSD9700 на одноразовый термопредохранитель RH130/RH135.
#
# Использование:
#   M141 S60     - задать температуру камеры
#   M191 S60     - задать и ждать (до S - start_offset)
#   iHEATER_OFF  - выключить нагрев камеры (также вызывается из TURN_OFF_HEATERS)
# В стартовый G-код слайсера после M190 добавьте: M191 S[chamber_temperature]
# ===================================================================

#========================================================
# MCU и пины - ЛЕВЫЙ iHeater (основной)
#========================================================
[mcu iHeater_left]
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_ЗАМЕНИТЕ_НА_СВОЙ_ID-if00 # ls /dev/serial/by-id/*
restart_method: command

[board_pins iHeater_left_Aliases]
mcu: iHeater_left
aliases:
    TH0=PA3, TH1=PA0, TH2=PB1,
    HEATER=PA1, FAN=PA2,
    MODE=PA4,
    LED_HEATER_ON=PA7,   # Правый светодиод (нагреватель)
    LED_TARGET_SET=PA6,  # Средний светодиод (задана температура)
    LED_FAN_ON=PA5,      # Левый светодиод (вентилятор)
    USART1_TX=PA9, USART1_RX=PA10

#========================================================
# MCU и пины - ПРАВЫЙ iHeater
#========================================================
[mcu iHeater_right]
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_ЗАМЕНИТЕ_НА_СВОЙ_ID_ДРУГОЙ-if00 # ID должен отличаться от левого
restart_method: command

[board_pins iHeater_right_Aliases]
mcu: iHeater_right
aliases:
    TH0=PA3, TH1=PA0, TH2=PB1,
    HEATER=PA1, FAN=PA2,
    MODE=PA4,
    LED_HEATER_ON=PA7,
    LED_TARGET_SET=PA6,
    LED_FAN_ON=PA5,
    USART1_TX=PA9, USART1_RX=PA10

#============================================================
# ЛЕВЫЙ iHeater
#============================================================

[heater_generic iHeater_left_H]
heater_pin: iHeater_left:HEATER
max_power: 1
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: iHeater_left:TH0
pwm_cycle_time: 0.3
min_temp: 0
max_temp: 120
control: pid
pid_Kp: 37.948
pid_Ki: 2.040
pid_Kd: 176.497

[verify_heater iHeater_left_H]
max_error: 120
check_gain_time: 60
hysteresis: 20
heating_gain: 0.2

[heater_fan chamber_heater_fan_left]
pin: iHeater_left:FAN
heater: iHeater_left_H
heater_temp: 50.0
fan_speed: 1.0
shutdown_speed: 0
kick_start_time: 0.5

[temperature_sensor iHeater_left_S]
sensor_pin: iHeater_left:TH1
sensor_type: NTC 100K MGB18-104F39050L32
min_temp: 0
max_temp: 140

[output_pin iHeater_L_Heater_On]
pin: iHeater_left:LED_HEATER_ON

[output_pin iHeater_L_Target_Set]
pin: iHeater_left:LED_TARGET_SET

[output_pin iHeater_L_Fan_On]
pin: iHeater_left:LED_FAN_ON

[gcode_button iHeater_left_button]
pin: iHeater_left:MODE
press_gcode: iHEATER_OFF

#============================================================
# ПРАВЫЙ iHeater
#============================================================

[heater_generic iHeater_right_H]
heater_pin: iHeater_right:HEATER
max_power: 1
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: iHeater_right:TH0
pwm_cycle_time: 0.3
min_temp: 0
max_temp: 120
control: pid
pid_Kp: 37.948
pid_Ki: 2.040
pid_Kd: 176.497

[verify_heater iHeater_right_H]
max_error: 120
check_gain_time: 60
hysteresis: 20
heating_gain: 0.2

[heater_fan chamber_heater_fan_right]
pin: iHeater_right:FAN
heater: iHeater_right_H
heater_temp: 50.0
fan_speed: 1.0
shutdown_speed: 0
kick_start_time: 0.5

[temperature_sensor iHeater_right_S]
sensor_pin: iHeater_right:TH1
sensor_type: NTC 100K MGB18-104F39050L32
min_temp: 0
max_temp: 140

[output_pin iHeater_R_Heater_On]
pin: iHeater_right:LED_HEATER_ON

[output_pin iHeater_R_Target_Set]
pin: iHeater_right:LED_TARGET_SET

[output_pin iHeater_R_Fan_On]
pin: iHeater_right:LED_FAN_ON

[gcode_button iHeater_right_button]
pin: iHeater_right:MODE
press_gcode: iHEATER_OFF

#######################################################
# ТЕМПЕРАТУРА КАМЕРЫ И НАСТРОЙКИ
#######################################################

# Среднее двух датчиков камеры. Если показания разойдутся больше чем на maximum_deviation,
# Klipper остановится с ошибкой (например, если датчик отпал)
[temperature_sensor Chamber]
sensor_type: temperature_combined
sensor_list: temperature_sensor iHeater_left_S, temperature_sensor iHeater_right_S
combination_method: mean
min_temp: 0
max_temp: 140
maximum_deviation: 20

[gcode_macro CHAMBER_VARS]
variable_chamber_target: 0          # Целевая температура камеры, °C
variable_start_offset: 10           # M191 ждёт до chamber_target - start_offset, °C
variable_delta_temp: 10             # На сколько нагреватель горячее цели камеры вблизи цели, °C
variable_min_heater_temp: 50        # Ниже этой температуры нагреватели считаются остывшими, °C
variable_max_heater_temp: 90        # Максимальная температура нагревателей, °C. Проверьте под ваш корпус
variable_control_interval: 1.0      # Период цикла управления, с
variable_air_min_delta: 0.5         # При отставании камеры от цели до этой величины нагреватель = цель + delta_temp, °C
variable_air_max_delta: 5.0         # При отставании от этой величины и больше нагреватель = max_heater_temp, °C
variable_verify_ac_power_delay: 60  # Через сколько секунд после начала нагрева проверять питание 220В, с
variable_min_heater_delta: 5        # При мощности > 90% нагреватель должен быть горячее камеры хотя бы на столько, °C
variable_heat_start_time: 0         # Служебная, не менять
variable_ac_power_verified: False   # Служебная, не менять
gcode:

#######################################################
# МАКРОСЫ
#######################################################

[gcode_macro M141]
description: Задать температуру камеры
gcode:
    {% set chamber_target = params.S|default(printer["gcode_macro CHAMBER_VARS"].chamber_target)|int %}
    {% set delta_temp = params.D|default(printer["gcode_macro CHAMBER_VARS"].delta_temp)|int %}
    {% set max_heater_temp = params.H|default(printer["gcode_macro CHAMBER_VARS"].max_heater_temp)|int %}

    RESPOND prefix="M141" msg="S{chamber_target} D{delta_temp} H{max_heater_temp}"

    SET_GCODE_VARIABLE MACRO=CHAMBER_VARS VARIABLE=chamber_target VALUE={chamber_target}
    SET_GCODE_VARIABLE MACRO=CHAMBER_VARS VARIABLE=delta_temp VALUE={delta_temp}
    SET_GCODE_VARIABLE MACRO=CHAMBER_VARS VARIABLE=max_heater_temp VALUE={max_heater_temp}

    # Запоминаем время начала нагрева для проверки питания 220В
    SET_GCODE_VARIABLE MACRO=CHAMBER_VARS VARIABLE=heat_start_time VALUE={printer.toolhead.estimated_print_time}
    SET_GCODE_VARIABLE MACRO=CHAMBER_VARS VARIABLE=ac_power_verified VALUE=False

    # Средний светодиод: температура задана (при S0 не включаем)
    SET_PIN PIN=iHeater_L_Target_Set VALUE={1 if chamber_target > 0 else 0}
    SET_PIN PIN=iHeater_R_Target_Set VALUE={1 if chamber_target > 0 else 0}

    iHEATER_CONTROL

[gcode_macro M191]
description: Задать температуру камеры и ждать её
gcode:
    {% set chamber_target = params.S|default(printer["gcode_macro CHAMBER_VARS"].chamber_target)|int %}
    {% set delta_temp = params.D|default(printer["gcode_macro CHAMBER_VARS"].delta_temp)|int %}
    {% set max_heater_temp = params.H|default(printer["gcode_macro CHAMBER_VARS"].max_heater_temp)|int %}
    {% set start_offset = params.W|default(printer["gcode_macro CHAMBER_VARS"].start_offset)|int %}

    RESPOND prefix="M191" msg="S{chamber_target} D{delta_temp} H{max_heater_temp} W{start_offset}"

    M141 S{chamber_target} D{delta_temp} H{max_heater_temp}
    SET_GCODE_VARIABLE MACRO=CHAMBER_VARS VARIABLE=start_offset VALUE={start_offset}

    {% set min_temp_to_wait = chamber_target - start_offset %}
    RESPOND prefix="M191" msg="Ожидание камеры {min_temp_to_wait}°C..."
    TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM={min_temp_to_wait}
    RESPOND prefix="M191" msg="Камера достигла {min_temp_to_wait}°C"

[gcode_macro iHEATER_ON]
description: Альтернатива M141/M191 с другими именами параметров
gcode:
    # CHAMBER_TEMP=<°C>       - целевая температура камеры
    # BED_TEMP=<°C>           - заодно задать температуру стола (необязательно)
    # DELTA=<°C>              - как delta_temp в CHAMBER_VARS
    # HEATER_MAX=<°C>         - как max_heater_temp в CHAMBER_VARS
    # CHAMBER_AWAIT_TEMP=<°C> - до какой температуры камеры ждать (абсолютное значение).
    #                           По умолчанию CHAMBER_TEMP - start_offset. 0 - не ждать
    {% set vars = printer["gcode_macro CHAMBER_VARS"] %}
    {% set s = params.CHAMBER_TEMP|default(vars.chamber_target)|int %}
    {% set b = params.BED_TEMP|default(0)|int %}
    {% set d = params.DELTA|default(vars.delta_temp)|int %}
    {% set h = params.HEATER_MAX|default(vars.max_heater_temp)|int %}
    {% set w = params.CHAMBER_AWAIT_TEMP|default(s - vars.start_offset|int)|int %}

    {% if b > 0 %}
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={b}
    {% endif %}

    {% if w > 0 %}
        # M191 принимает W как отступ от цели, поэтому переводим абсолютную температуру в отступ
        M191 S{s} D{d} H{h} W{s - w}
    {% else %}
        M141 S{s} D{d} H{h}
    {% endif %}

[gcode_macro iHEATER_OFF]
description: Выключить нагрев камеры
gcode:
    SET_GCODE_VARIABLE MACRO=CHAMBER_VARS VARIABLE=chamber_target VALUE=0
    SET_HEATER_TEMPERATURE HEATER=iHeater_left_H TARGET=0
    SET_HEATER_TEMPERATURE HEATER=iHeater_right_H TARGET=0

    # Сброс проверки питания 220В
    SET_GCODE_VARIABLE MACRO=CHAMBER_VARS VARIABLE=heat_start_time VALUE=0
    SET_GCODE_VARIABLE MACRO=CHAMBER_VARS VARIABLE=ac_power_verified VALUE=False

    # Выключаем все светодиоды
    SET_PIN PIN=iHeater_L_Target_Set VALUE=0
    SET_PIN PIN=iHeater_R_Target_Set VALUE=0
    SET_PIN PIN=iHeater_L_Heater_On VALUE=0
    SET_PIN PIN=iHeater_R_Heater_On VALUE=0
    SET_PIN PIN=iHeater_L_Fan_On VALUE=0
    SET_PIN PIN=iHeater_R_Fan_On VALUE=0

    # Последний цикл управления: дождаться остывания нагревателей
    UPDATE_DELAYED_GCODE ID=_iHEATER_CONTROL DURATION=1
    RESPOND prefix="iHeater_off" msg="Нагрев камеры выключен (оба iHeater)."

[gcode_macro TURN_OFF_HEATERS]
description: Выключить все нагреватели, включая нагрев камеры
rename_existing: _TURN_OFF_HEATERS_BASE
gcode:
    # Без этого цикл управления камерой снова включил бы нагреватели через секунду после
    # PRINT_END, CANCEL_PRINT или ошибки печати
    iHEATER_OFF
    _TURN_OFF_HEATERS_BASE

# Если нагреватели ещё тёплые после перезагрузки, светодиоды вентиляторов должны это показывать
[delayed_gcode _UPDATE_FAN_LEDS]
initial_duration: 5
gcode:
    SET_PIN PIN=iHeater_L_Fan_On VALUE={1 if printer['heater_fan chamber_heater_fan_left'].speed > 0 else 0}
    SET_PIN PIN=iHeater_R_Fan_On VALUE={1 if printer['heater_fan chamber_heater_fan_right'].speed > 0 else 0}

    {% if printer['heater_fan chamber_heater_fan_left'].speed + printer['heater_fan chamber_heater_fan_right'].speed > 0 %}
        UPDATE_DELAYED_GCODE ID=_UPDATE_FAN_LEDS DURATION=3
    {% endif %}

[gcode_macro _AC_POWER_FAULT]
gcode:
    {% set heater_list = params.HEATER_LIST|default("Unknown") %}
    iHEATER_OFF
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    { action_raise_error("Отказ нагрева: %s не нагревается. Проверьте питание 220В iHeater." % heater_list) }

[gcode_macro iHEATER_CONTROL]
gcode:
    # --- 1. Светодиоды по текущему состоянию ---
    SET_PIN PIN=iHeater_L_Heater_On VALUE={1 if printer['heater_generic iHeater_left_H'].power > 0.3 else 0}
    SET_PIN PIN=iHeater_R_Heater_On VALUE={1 if printer['heater_generic iHeater_right_H'].power > 0.3 else 0}
    SET_PIN PIN=iHeater_L_Fan_On VALUE={1 if printer['heater_fan chamber_heater_fan_left'].speed > 0 else 0}
    SET_PIN PIN=iHeater_R_Fan_On VALUE={1 if printer['heater_fan chamber_heater_fan_right'].speed > 0 else 0}

    # --- 2. Управление температурой ---
    {% set chamber_vars = printer["gcode_macro CHAMBER_VARS"] %}
    {% set target_chamber_temp = chamber_vars.chamber_target|float %}
    {% set control_interval = chamber_vars.control_interval|float %}
    {% set target_heater_temp = 0.0 %}

    {% if target_chamber_temp > 0 %}
        # --- НАГРЕВ ---
        # Температура нагревателей: цель камеры + от delta_temp (камера почти у цели)
        # до max_heater_temp (камера отстаёт на air_max_delta и больше)
        {% set chamber_temp = printer["temperature_sensor Chamber"].temperature %}
        {% set temp_diff = target_chamber_temp - chamber_temp %}
        {% set output_range = ([chamber_vars.delta_temp, chamber_vars.max_heater_temp - target_chamber_temp]|max) - chamber_vars.delta_temp %}
        {% set input_range = chamber_vars.air_max_delta - chamber_vars.air_min_delta %}
        {% set slope = output_range / input_range if input_range > 0 else 0 %}
        {% set clamped_input = ([chamber_vars.air_min_delta, temp_diff, chamber_vars.air_max_delta]|sort)[1] %}
        {% set adjustment = chamber_vars.delta_temp + slope * (clamped_input - chamber_vars.air_min_delta) %}
        {% set target_heater_temp = (target_chamber_temp + adjustment)|round(2) %}

        # --- ПРОВЕРКА ПИТАНИЯ 220В ---
        # Плата питается от USB, нагреватель - от 220В. Если 220В нет, нагреватель на полной
        # мощности не нагревается: останавливаем нагрев
        {% if not chamber_vars.ac_power_verified %}
            {% set start_time = chamber_vars.heat_start_time|float %}
            {% set current_time = printer.toolhead.estimated_print_time|float %}
            {% set verify_delay = chamber_vars.verify_ac_power_delay|float %}

            {% if start_time > 0 and current_time > start_time + verify_delay %}
                {% set faulty_heaters = [] %}

                {% set lh_power = printer['heater_generic iHeater_left_H'].power %}
                {% set lh_temp = printer['heater_generic iHeater_left_H'].temperature %}
                {% set lc_temp = printer['temperature_sensor iHeater_left_S'].temperature %}
                {% if lh_power > 0.9 and lh_temp < lc_temp + chamber_vars.min_heater_delta %}
                    {% set faulty_heaters = faulty_heaters + ['левый iHeater'] %}
                {% endif %}

                {% set rh_power = printer['heater_generic iHeater_right_H'].power %}
                {% set rh_temp = printer['heater_generic iHeater_right_H'].temperature %}
                {% set rc_temp = printer['temperature_sensor iHeater_right_S'].temperature %}
                {% if rh_power > 0.9 and rh_temp < rc_temp + chamber_vars.min_heater_delta %}
                    {% set faulty_heaters = faulty_heaters + ['правый iHeater'] %}
                {% endif %}

                {% if faulty_heaters|length > 0 %}
                    _AC_POWER_FAULT HEATER_LIST="{faulty_heaters|join(' и ')}"
                {% else %}
                    # Проверка пройдена, больше не повторяем
                    SET_GCODE_VARIABLE MACRO=CHAMBER_VARS VARIABLE=ac_power_verified VALUE=True
                {% endif %}
            {% endif %}
        {% endif %}

    {% else %}
        # --- ОСТЫВАНИЕ / ОЖИДАНИЕ ---
        # Когда оба нагревателя остыли, гасим светодиоды и останавливаем цикл
        {% set min_heater_temp = chamber_vars.min_heater_temp|float %}
        {% if printer["heater_generic iHeater_left_H"].temperature < min_heater_temp and printer["heater_generic iHeater_right_H"].temperature < min_heater_temp %}
            RESPOND prefix="iHeater_control" msg="Нагреватели остыли."
            SET_PIN PIN=iHeater_L_Target_Set VALUE=0
            SET_PIN PIN=iHeater_R_Target_Set VALUE=0
            SET_PIN PIN=iHeater_L_Fan_On VALUE=0
            SET_PIN PIN=iHeater_R_Fan_On VALUE=0
            {% set control_interval = 0.0 %}
        {% endif %}
    {% endif %}

    # Одинаковая цель для обоих нагревателей
    SET_HEATER_TEMPERATURE HEATER=iHeater_left_H TARGET={target_heater_temp}
    SET_HEATER_TEMPERATURE HEATER=iHeater_right_H TARGET={target_heater_temp}

    # Следующий цикл (0 - остановить)
    UPDATE_DELAYED_GCODE ID=_iHEATER_CONTROL DURATION={control_interval}

[delayed_gcode _iHEATER_CONTROL]
gcode:
    iHEATER_CONTROL
