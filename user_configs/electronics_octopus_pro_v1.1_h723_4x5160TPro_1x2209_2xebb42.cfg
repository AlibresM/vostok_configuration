# Базовая конфигурация VOSTOK v9.0
# ------------------------
# Файл распространяется под лицензией CC-BY 4.0
# ------------------------
#
# Плата: BigTreeTech Octopus Pro v1.1 H723
# Плата головы: BigTreeTech EBB42 CAN V1.2.1
# Драйверы: 4x tmc5160T Pro (Portal), 1x tmc2209 (Z) !Проверь перемычки питания драйверов!
# Датчик автоуровня: BTT Microprobe
# Доп.оборудование: подсветка отсека печати
#
#
# Платы MCU и головы подключаються по CAN-Bus. Секции в printer.cfg должны называться [mcu T0CB] и
# [mcu T1CB] для левой и правой печатающей головы соответственно и выглядят следующим образом:
#[mcu]
#canbus_uuid: 2596c52b488f #bash: python3 ~/katapult/scripts/flashtool.py -i can0 -q
#
#[mcu T0CB]
#canbus_uuid: 6d5ad4c961d9 #bash: python3 ~/katapult/scripts/flashtool.py -i can0 -q
#
#[mcu T1CB]
#canbus_uuid: 2c744beb9452 #bash: python3 ~/katapult/scripts/flashtool.py -i can0 -q
#
#Лучший гайд по CAN-bus на просторах интернета: https://canbus.esoterical.online/
#
#
#--------------------------------------------------------
#          Оборудование             |      Разъём       |
#-----------------------------------|-------------------|
# Мотор оси X                       | MOTOR0            |
# Мотор оси W                       | MOTOR1            |
# Левый мотор оси Y                 | MOTOR2            |
# Правый мотор оси Y                | MOTOR3            |
# Мотор оси Z                       | MOTOR4            |
# Мотор фидера левой головы         | T0CB:E-MOT        |
# Мотор фидера правой головы        | T1CB:E-MOT        |
# Нагреватель левой головы          | T0CB:Hotend       |
# Нагреватель правой головы         | T1CB:Hotend       |
# Нагреватель стола                 | HE0               |
# Реле питания нагревателей         | HE1               | (Включено, только когда Klipper работает. Выключается при аварийной остановке, ошибке и потере связи с хостом)
# Термистор левой головы            | T0CB:TH0          |
# Термистор правой головы           | T1CB:TH0          |
# Термистор стола                   | TB                |
# Охлаждение хотэнда левой головы   | T0CB:FAN 0        |
# Охлаждение хотэнда правой головы  | T1CB:FAN 0        |
# Охлаждение платы левой головы     | T0CB:FAN 1        |
# Охлаждение платы правой головы    | T1CB:FAN 1        |
# Охлаждение модели                 | STOP4 (PG12)      | (Питание драйвера ws7040 подключается к БП 24 В. На пин подключается только пин ШИМ драйвера. Подробнее: https://www.bondtech.se/downloads/SetupGuides/bondtech_EXT-KIT-97-03_EXT-KIT-97-04_15173_CPAP-supplementary-wiring-guide.pdf?srsltid=AfmBOoqhJIR2pmFrltkhaex3I70HB_p1164zM7Zs-7mOxGRSqt0oVGx8)
# Охлаждение отсека электроники     | FAN1              |
# Концевик оси X                    | T0CB:STOP0        |
# Концевик оси W                    | T1CB:STOP0        |
# Концевик оси Y левый              | STOP2             |
# Концевик оси Y правый             | STOP3             |
# Датчик автоуровня                 | T0CB:BLtouch      |
# Акселерометр левой головы         | T0CB (на плате)   |
# Акселерометр правой головы        | T1CB (на плате)   |
# Подсветка отсека печати           | HE3               |
#--------------------------------------------------------

#########################################################
# Двигатели
#########################################################

[stepper motor_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
full_steps_per_rotation: 200

[stepper motor_w]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
full_steps_per_rotation: 200

[stepper motor_yl]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
full_steps_per_rotation: 200

[stepper motor_yr]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
full_steps_per_rotation: 200

[stepper motor_z]
step_pin: PF9
dir_pin: !PF10
enable_pin: !PG2
full_steps_per_rotation: 200

[extruder]
step_pin: T0CB:PD0
dir_pin: !T0CB:PD1
enable_pin: !T0CB:PD2
full_steps_per_rotation: 200

[extruder1]
step_pin: T1CB:PD0
dir_pin: T1CB:PD1
enable_pin: !T1CB:PD2
full_steps_per_rotation: 200

#########################################################
# Драйверы
#########################################################

[tmc5160 stepper motor_x]
cs_pin: PC4
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 1.1
stealthchop_threshold: 0
interpolate: False

[tmc5160 stepper motor_w]
cs_pin: PD11
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 1.1
stealthchop_threshold: 0
interpolate: False

[tmc5160 stepper motor_yl]
cs_pin: PC6
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 1.1
stealthchop_threshold: 0
interpolate: False

[tmc5160 stepper motor_yr]
cs_pin: PC7
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 1.1
stealthchop_threshold: 0
interpolate: False

[tmc2209 stepper motor_z]
uart_pin: PF2
run_current: 1.2
stealthchop_threshold: 0

[tmc2209 extruder]
uart_pin: T0CB:PA15
run_current: 0.8
stealthchop_threshold: 0

[tmc2209 extruder1]
uart_pin: T1CB:PA15
run_current: 0.8
stealthchop_threshold: 0

#########################################################
# Концевики и датчик автоуровня
#########################################################

[carriage xc]
endstop_pin: ^T0CB:PB6

[dual_carriage wc]
endstop_pin: ^T1CB:PB6

[carriage ylc]
endstop_pin: ^PG10

[extra_carriage yrc]
endstop_pin: ^PG11

[probe]
pin: ^!T0CB:PB8

[output_pin probe_enable]
pin: T0CB:PB9
value: 0

[gcode_macro PROBE_DEPLOY]
gcode:
    SET_PIN PIN=probe_enable VALUE=1

[gcode_macro PROBE_STOW]
gcode:
    SET_PIN PIN=probe_enable VALUE=0

#########################################################
# Нагреватели и термисторы
#########################################################

[extruder]
heater_pin: T0CB:PB13
sensor_pin: T0CB:PA3

[extruder1]
heater_pin: T1CB:PB13
sensor_pin: T1CB:PA3

[heater_bed]
heater_pin: PA0
sensor_pin: PF3

# Реле питания нагревателей (HE1). Включается, когда Klipper запущен и связался с платой (value: 1).
# Выключается при любом shutdown (shutdown_value: 0): M112 / аварийная остановка, ошибка нагревателя,
# потеря связи с хостом. Пока Klipper не запущен, выход HE1 выключен, поэтому реле тоже выключено.
# Выход HE1 - 24В, коммутируется на минус: катушку реле подключайте через защитный диод или используйте модуль реле/SSR
[output_pin heaters_power_relay]
pin: PA3
value: 1
shutdown_value: 0

#########################################################
# Вентиляторы
#########################################################

[fan]
pin: PG12

[heater_fan e0_fan]
pin: T0CB:PA0

[heater_fan e1_fan]
pin: T1CB:PA0

[controller_fan electronics_fan]
pin: PE5

[controller_fan T0CB_fan]
pin: T0CB:PA1

[controller_fan T1CB_fan]
pin: T1CB:PA1

#########################################################
# Подсветка
#########################################################

[led print_chamber_led]
white_pin: PB11
initial_WHITE: 1.0

#########################################################
# Акселерометры
#########################################################

# ADXL345 на платах EBB42 (пины по образцу BTT для EBB CAN V1.2).
# Имена t0_accelerometer и t1_accelerometer используются в IDEX_SHAPER_CALIBRATE по умолчанию
# axes_map зависит от того, как плата установлена на голове. Проверка: ACCELEROMETER_QUERY CHIP=t0_accelerometer
# в покое должен показать ускорение свободного падения (около 9800 мм/с² по модулю) по оси z
[adxl345 t0_accelerometer]
cs_pin: T0CB:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[adxl345 t1_accelerometer]
cs_pin: T1CB:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345 t0_accelerometer
probe_points:
    200,125,20

#########################################################
# Температуры плат
#########################################################

[temperature_sensor host]
sensor_type: temperature_host

[temperature_sensor Octopus_Pro]
sensor_type: temperature_mcu

[temperature_sensor T0CB_mcu]
sensor_type: temperature_mcu
sensor_mcu: T0CB

[temperature_sensor T1CB_mcu]
sensor_type: temperature_mcu
sensor_mcu: T1CB